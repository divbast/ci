# actionlint's configuration for every divbast repository. common.just's
# actionlint recipe passes it from the checkout of ci; here, it is also
# where actionlint looks on its own.

# actionlint's built-in runner list predates ubuntu-26.04, which is a
# GitHub-hosted runner, not a self-hosted one.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub documents job.workflow_ref, _sha, _repository and _file_path,
      # which name a reusable workflow's own commit, but actionlint 1.7.12's
      # job context does not have them yet (rhysd/actionlint#705). Only these
      # four names on the job context, whose type starts {check_run_id:, so
      # a misspelt one still fails.
      - '^property "workflow_(ref|sha|repository|file_path)" is not defined in object type \{check_run_id: '
      # GitHub documents concurrency's queue key, whose max lets pending
      # runs wait their turn instead of replacing one another, but
      # actionlint 1.7.12 does not know it yet (rhysd/actionlint#657). Only
      # that key, so any other unknown key under concurrency still fails.
      - '^unexpected key "queue" for "concurrency" section\. '
