# The stall check every divbast repository calls from a daily schedule. It
# fails, so GitHub emails someone, when updates have stopped flowing without
# anything failing loudly: a Renovate pull request that never goes green or
# never finishes, Renovate itself silent, daily slots that should have
# published and did not, a dependency Renovate failed to look up, or an
# update left waiting too long, both of which only its Dependency
# Dashboard shows, or a job that both failed and passed on one commit. A
# scheduled run's failure goes to whoever last edited the caller's cron
# line. The checks are cmd/divbast-stall's.
#
# The caller's job grants contents, pull-requests, actions, checks,
# statuses, packages and issues, all read.
name: stall

on:
  workflow_call:
    inputs:
      checks:
        description: The checks to run, a JSON array of open, stuck, renovate, slots, lookups, starved and flaky
        type: string
        default: '["open","stuck","renovate","slots","lookups","starved","flaky"]'
      published:
        description: The image the daily slot publishes, such as ghcr.io/divbast/librespeed:latest; slots needs it
        type: string
        default: ''
      slot-workflow:
        description: The workflow file whose scheduled runs on main are the daily slots
        type: string
        default: build.yml
      renovate-workflow:
        description: The workflow file that runs Renovate
        type: string
        default: renovate.yml
      stall-workflow:
        description: The caller's workflow file that calls this one on a schedule, whose previous run starts flaky's window
        type: string
        default: stall.yml
      open-days:
        description: Days a Renovate pull request may stay open
        type: number
        default: 14
      stuck-hours:
        description: Hours one may stay red since it opened, or pending since its last push
        type: number
        default: 24
      run-hours:
        description: Hours Renovate may go without a successful run
        type: number
        default: 48
      lost-slots:
        description: Lost daily slots that make a stall
        type: number
        default: 2
      starved-days:
        description: Days an update may wait on the Dependency Dashboard, under Pending Status Checks or Awaiting Schedule
        type: number
        default: 7
      content-gated:
        description: The slot workflow publishes only when the image's content moved, so once the image is published a slot run that succeeded is never lost
        type: boolean
        default: false
      slot-job:
        description: With content-gated, the job in each slot run that publishes the image, as GitHub names it in the run, such as "publish (baikal)", whose conclusion counts rather than the whole run's; empty for the run's
        type: string
        default: ''

permissions: {}

env:
  # The mise release jdx/mise-action installs. Renovate moves it.
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.11.14
  # mise gives a failed tool download 3 retries, over about 5 seconds. 5
  # retries wait up to about 35 seconds (200ms, 1s, 4s, then 15s each, with
  # jitter), enough to outlast a short outage of the download host.
  MISE_HTTP_RETRIES: "5"

jobs:
  # One job per check, so a run names every stall and not only the first.
  stall:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.checks) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # read main, compare commits, the repository's age
      pull-requests: read # list Renovate's pull requests
      actions: read # list the Renovate and slot runs
      checks: read # read each pull request's check runs
      statuses: read # and its commit statuses
      packages: read # tell a private image from an absent one
      issues: read # read the Dependency Dashboard
    # Nothing of the caller's is checked out: every check reads the GitHub
    # API and the registry, and nothing else.
    steps:
      - name: Check out divbast/ci at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false

      # ci's own Go, the one its tools are built and tested with, and
      # nothing else of its toolchain.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          working_directory: .ci
          install_args: core:go

      - name: Build ci's tools
        run: go -C .ci build -o "${GITHUB_WORKSPACE}/.ci/bin/" ./cmd/...

      - name: Check ${{ matrix.check }}
        env:
          CHECK: ${{ matrix.check }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPEN_DAYS: ${{ inputs.open-days }}
          STUCK_HOURS: ${{ inputs.stuck-hours }}
          RUN_HOURS: ${{ inputs.run-hours }}
          LOST_SLOTS: ${{ inputs.lost-slots }}
          STARVED_DAYS: ${{ inputs.starved-days }}
          PUBLISHED: ${{ inputs.published }}
          SLOT_WORKFLOW: ${{ inputs.slot-workflow }}
          RENOVATE_WORKFLOW: ${{ inputs.renovate-workflow }}
          STALL_WORKFLOW: ${{ inputs.stall-workflow }}
          CONTENT_GATED: ${{ inputs.content-gated }}
          SLOT_JOB: ${{ inputs.slot-job }}
        # -content-gated is a flag of slots alone, and given only when the
        # caller sets content-gated, so that a caller who does not runs
        # every check as it always has.
        run: |
          if [[ "${CHECK}" == slots && "${CONTENT_GATED}" == true ]]; then
            .ci/bin/divbast-stall slots -content-gated
          else
            .ci/bin/divbast-stall "${CHECK}"
          fi
