# ci's own CI. The lint job calls lint.yml from this same commit, so every
# change to it is run here before any caller can pin it.
name: self-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    # A job-level call, which GitHub resolves from this commit before any
    # step runs, so no checkout can stand in for it. The $/ form zizmor asks
    # for is one actionlint 1.7.12 cannot parse yet.
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository] see above
    with:
      php: true
    permissions:
      contents: read

  # Both engines on both arches, the matrix the harness and contract tests
  # run under.
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        engine: [docker, podman]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # The probe's own tests run it with the host's PHP, the version the
      # images run. mise's PHP backend compiles PHP from source.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Allow unprivileged user namespaces
        if: matrix.engine == 'podman'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Rootless podman schedules an image HEALTHCHECK through a transient
      # systemd user timer. A runner has no user session, so podman silently
      # falls back to the cgroupfs manager, never runs the check, and leaves
      # State.Health a nil pointer - which reads as a broken image rather than
      # a runner that cannot schedule anything.
      - name: Give podman a systemd user session
        if: matrix.engine == 'podman'
        run: |
          sudo loginctl enable-linger "${USER}"
          uid=$(id -u)
          for _ in $(seq 30); do
            [ -S "/run/user/${uid}/bus" ] && break
            sleep 1
          done
          [ -S "/run/user/${uid}/bus" ] || {
            echo "no user bus at /run/user/${uid}/bus after 30s" >&2
            exit 1
          }
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "${GITHUB_ENV}"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" \
            >> "${GITHUB_ENV}"

      - name: Use slirp4netns rather than pasta
        if: matrix.engine == 'podman'
        run: |
          mkdir -p ~/.config/containers
          printf '[network]\ndefault_rootless_network_cmd = "slirp4netns"\n' \
            > ~/.config/containers/containers.conf
          podman info --format '{{.Host.RootlessNetworkCmd}}'
          # systemd here, not cgroupfs, or the healthcheck timer never fires.
          podman info --format '{{.Host.CgroupManager}}'

      - name: Tests
        env:
          ENGINE: ${{ matrix.engine }}
        run: just test

  # On a pull request, the release its merge would make, in the run's
  # summary, from divbast-release's dry run of GitHub's test merge into
  # main. required needs it, so a release that would fail stops the merge.
  # On any other event, a push to main among them, every step is skipped
  # and the job succeeds: the release job's own log says what main
  # releases, and a preview there could race an earlier merge's release
  # minting its tag.
  release-preview:
    name: release-preview
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Every commit and tag, which the next version is counted from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      # ci's own Go, and nothing else of its toolchain
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        if: github.event_name == 'pull_request'
        with:
          install_args: core:go

      - name: Build ci's tools
        if: github.event_name == 'pull_request'
        run: go build -o "${GITHUB_WORKSPACE}/bin/" ./cmd/...

      - name: Preview this pull request's release
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # A tag minted since checkout, which the tool refuses a clone to lack
          git fetch --quiet --tags origin
          out=$(bin/divbast-release -sha "${GITHUB_SHA}" -dry-run)
          version=${out%%$'\n'*}
          {
            echo '## Release preview'
            echo
            # Anything but a version says a release tag is already here
            if [[ ! ${version} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${out}"
              exit 0
            fi
            kind=minor
            if [[ ${version} =~ ^v[0-9]+\.0\.0$ ]]; then
              kind=major
            fi
            echo "Merging this pull request would release **${version}**, a ${kind} release."
            echo
            echo "This is a prediction from GitHub's test merge into main: the" \
              "commit GitHub makes when it merges can carry the pull" \
              "request's title, which this preview cannot see."
            echo
            echo '```markdown'
            echo "${out#*$'\n\n'}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # The one check main's ruleset requires, so the job list can change without
  # touching the ruleset. GitHub counts a skipped required check as passing,
  # so this runs always and treats a skipped or cancelled job as a failure.
  required:
    name: required
    needs: [lint, test, release-preview]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [ "${result}" != success ]; then
              echo "a required job ended ${result}" >&2
              exit 1
            fi
          done

  # Every green merge to main is released: the next vX.Y.Z tag at that
  # commit, as an immutable GitHub Release whose notes are the commits since
  # the last one (cmd/divbast-release). Callers pin ci at a release's commit
  # with its tag as the comment, which zizmor and pinact can check.
  release:
    name: release
    needs: [required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One at a time, so each counts from the tag the one before it made.
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # For the App's key, which only main may deploy to, so no branch's
    # workflow can mint a tag. Not a deployment, or every merge would add
    # one to the environment's history.
    environment:
      name: renovate
      deployment: false
    # The App's token makes the tag and the release; this one only reads.
    permissions:
      contents: read
    steps:
      # Every commit and tag, which the next version is counted from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ci's own Go, and nothing else of its toolchain
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: core:go

      - name: Build ci's tools
        run: go build -o "${GITHUB_WORKSPACE}/bin/" ./cmd/...

      # Narrowed to this repository and to writing its contents, which a
      # tag and a release need; the org App is installed on every divbast
      # repository. Minted last, just before it is used.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ci
          permission-contents: write

      - name: Release this commit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: bin/divbast-release -sha "${GITHUB_SHA}"
