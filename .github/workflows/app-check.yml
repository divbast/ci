# The checks every divbast app repository's build workflow calls, on every
# event it runs on: lint, build the image for both architectures, then run
# the acceptance suite against each under Docker and Podman, and scan it.
# Every job checks divbast/ci out at this workflow's commit into .ci and
# fails unless the caller's workflows all pin that commit, then runs the
# caller's own recipes, which import the shared ones from .ci.
#
# The images it builds are the ones app-publish.yml pushes: the build job
# uploads each as the artifact image-<arch>.
#
# A Containerfile may build from Docker Hardened Images, which dhi.io
# answers nothing about without a login. A caller that passes the input
# dhi-username and the secret DHI_TOKEN has the lint and build jobs log in
# first; both are optional, and a caller that passes neither lints and
# builds as before. A pull request from a fork gets no secrets, so it
# cannot lint or build a DHI image.
#
# The caller's job grants contents: read, attestations: read,
# packages: read and security-events: write. The lint and build jobs
# install the caller's whole mise.toml, which must declare cosign as
# "aqua:sigstore/cosign", for divbast-verify-images: build runs it on the
# root Containerfile, and lint on each Containerfile the optional
# verify-containerfiles input lists. Of the caller's mise.toml, the scan
# job installs only Go, just, Trivy, grype and cosign, each declared at
# one version: Go as "core:go" (mise reads the short "go" the same way),
# and just, Trivy, grype and cosign as exactly "aqua:casey/just",
# "aqua:aquasecurity/trivy", "aqua:anchore/grype" and
# "aqua:sigstore/cosign".
name: app-check

on:
  workflow_call:
    inputs:
      php:
        description: Install PHP 8.5 and Composer, for a lint that runs PHPStan
        type: boolean
        default: false
      no-cache-filters:
        description: >-
          No effect. The daily slot and a manual run already build every
          stage from scratch, with no cache restored, on a builder made for
          the job, so the stages named here change nothing. Kept so that a
          caller passing it keeps working
        type: string
        default: ''
      dhi-username:
        description: >-
          The Docker Hardened Images (dhi.io) username that DHI_TOKEN
          belongs to. When set, lint and build log in to dhi.io with it
        type: string
        default: ''
      verify-containerfiles:
        description: >-
          Containerfiles besides the root one, one path per line from the
          caller's root, whose images the lint job verifies before just
          lint runs, as the build job verifies the root one's. A caller
          lists each Containerfile whose images its lint runs, such as a
          template layer's
        type: string
        default: ''
      full-history:
        description: >-
          Check the caller out with its whole git history in the lint job,
          for a lint that scans every commit, such as a secret scan. Off,
          the checkout holds the one commit, as it always has
        type: boolean
        default: false
    secrets:
      DHI_TOKEN:
        description: The access token for dhi-username on dhi.io
        required: false

permissions: {}

env:
  # The mise release jdx/mise-action installs. Renovate moves it.
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.11.14
  # mise gives a failed tool download 3 retries, over about 5 seconds. 5
  # retries wait up to about 35 seconds (200ms, 1s, 4s, then 15s each, with
  # jitter), enough to outlast a short outage of the download host.
  MISE_HTTP_RETRIES: "5"

jobs:
  # lint.yml's steps, and what an app's lint needs besides. The pin
  # check's skip names divbast/ci, which never calls this workflow, so a
  # caller's pin is always checked. The job also logs in to dhi.io, and
  # verifies the images of the Containerfiles verify-containerfiles
  # lists, for which it asks attestations: read. A job calling lint.yml
  # would be a reusable workflow nested in this one, and its check would
  # be named `<caller> / lint / lint`.
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read # a listed Containerfile may name divbast/frankenphp, whose attestation it checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The strings, since an expression reads the number 0 as false.
          fetch-depth: ${{ inputs.full-history && '0' || '1' }}
          persist-credentials: false

      # A step's `uses: ./` and a recipe's .ci/ both resolve against the
      # caller's checkout, so this workflow's own commit goes in there.
      - name: Check out divbast/ci at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false

      # Before the pin check, which needs the caller's pinned Go.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      # `just setup` would otherwise check .ci out again at whatever commit
      # the caller's workflows pin, and lint with that one. ci's tools build
      # as ci's own module, since Go maps no ./.ci/ path into a caller's
      # module, and run from the caller's root, so -dir's default is its.
      - name: Check the caller pins this commit of divbast/ci
        if: github.repository != 'divbast/ci'
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          go -C .ci build -o "${GITHUB_WORKSPACE}/.ci/bin/" ./cmd/...
          .ci/bin/divbast-pin -expect "${WORKFLOW_SHA}"

      # mise's PHP backend compiles PHP from source.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: inputs.php
        with:
          php-version: '8.5'
          coverage: none

      # dhi.io answers nothing without a login, `docker build --check` reads
      # each base's metadata from it, and a fork's pull request has no secret.
      - name: Log in to dhi.io
        if: inputs.dhi-username != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ inputs.dhi-username }}
          password: ${{ secrets.DHI_TOKEN }}

      # Before anything the lint runs from them, each listed Containerfile's
      # images are verified as the build job verifies the root one's. The
      # pin check above has built the tool. divbast-verify-images keeps its
      # own empty DOCKER_CONFIG, so it needs the DHI credentials in its
      # environment, not the job's login.
      - name: Verify the images the listed Containerfiles build from
        if: inputs.verify-containerfiles != ''
        env:
          VERIFY_CONTAINERFILES: ${{ inputs.verify-containerfiles }}
          GH_TOKEN: ${{ github.token }}
          DHI_USERNAME: ${{ inputs.dhi-username }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          while read -r f; do
            [ -n "${f}" ] || continue
            echo "${f}:"
            .ci/bin/divbast-verify-images -containerfile "${f}"
          done <<<"${VERIFY_CONTAINERFILES}"

      - run: just setup
      - run: just lint
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read # verify the attestations of the images the Containerfile builds from
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A step's `uses: ./` and a recipe's .ci/ both resolve against the
      # caller's checkout, so this workflow's own commit goes in there.
      - name: Check out divbast/ci at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false

      # Before the pin check, which needs the caller's pinned Go.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      # `just setup` would otherwise check .ci out again at whatever commit
      # the caller's workflows pin, and lint with that one. ci's tools build
      # as ci's own module, since Go maps no ./.ci/ path into a caller's
      # module, and run from the caller's root, so -dir's default is its.
      - name: Check the caller pins this commit of divbast/ci
        if: github.repository != 'divbast/ci'
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          go -C .ci build -o "${GITHUB_WORKSPACE}/.ci/bin/" ./cmd/...
          .ci/bin/divbast-pin -expect "${WORKFLOW_SHA}"

      # dhi.io answers nothing without a login, and the verification and the
      # build both read each base from it. A fork's pull request has no secret.
      - name: Log in to dhi.io
        if: inputs.dhi-username != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ inputs.dhi-username }}
          password: ${{ secrets.DHI_TOKEN }}

      # Before anything is built from them: every image the Containerfile
      # names must be pinned by digest, and each whose publisher signs it
      # verified as theirs, divbast/frankenphp by its main build's
      # attestation and distroless by its cosign signature. A local
      # `just build` skips this.
      - name: Verify the images the Containerfile builds from
        env:
          GH_TOKEN: ${{ github.token }}
          DHI_USERNAME: ${{ inputs.dhi-username }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: .ci/bin/divbast-verify-images

      # The default docker driver cannot write an image index
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Pin the build clock to the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "${GITHUB_ENV}"
      # Never for the two events that publish, which build from scratch.
      - name: Cache the build layers
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.arch }}-${{ hashFiles('Containerfile') }}-${{ github.run_id }}
          restore-keys: |
            buildx-${{ matrix.arch }}-${{ hashFiles('Containerfile') }}-
            buildx-${{ matrix.arch }}-

      # An OCI layout is used to enable attestations
      - name: Build the image
        env:
          NO_CACHE_FILTERS: ${{ inputs.no-cache-filters }}
        run: |
          image=$(just --evaluate IMAGE)
          args=(
            --attest 'type=provenance,mode=max'
            --attest 'type=sbom,generator=docker/buildkit-syft-scanner:1.13.0@sha256:a190379321cf51fba8c284a1834555b55e7bf58d577d574db23370461defc430'
            --output 'type=oci,dest=/tmp/image.tar,rewrite-timestamp=true'
            -f Containerfile -t "${image}"
          )
          if [ "${GITHUB_EVENT_NAME}" = schedule ] ||
            [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            # The daily slot and the button, the two runs that publish. A
            # cache hit there would mean the daily build tested nothing
            # upstream, and a publish would ship whatever a push or pull
            # request last fetched. Neither restores the cache, and the
            # builder is the one setup-buildx made for this job, so every
            # stage builds from scratch already, and the --no-cache-filter
            # flags below change nothing.
            read -ra stages <<<"${NO_CACHE_FILTERS}"
            for stage in "${stages[@]}"; do
              args+=(--no-cache-filter "${stage}")
            done
          else
            # reset=true replaces the export rather than appending to it, which
            # stops the directory growing every run until it is too large to
            # restore. Needs Buildx 0.35 or later; the runner has 0.38.
            args+=(
              --cache-from 'type=local,src=/tmp/.buildx-cache'
              --cache-to 'type=local,dest=/tmp/.buildx-cache,mode=max,reset=true'
            )
          fi
          docker buildx build "${args[@]}" .

      - name: Publish the image as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image.tar
          retention-days: 1
          if-no-files-found: error

  test:
    name: test
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        engine: [docker, podman]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A step's `uses: ./` and a recipe's .ci/ both resolve against the
      # caller's checkout, so this workflow's own commit goes in there.
      - name: Check out divbast/ci at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false

      # Before the pin check, which needs the caller's pinned Go.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}

      # `just setup` would otherwise check .ci out again at whatever commit
      # the caller's workflows pin, and lint with that one. ci's tools build
      # as ci's own module, since Go maps no ./.ci/ path into a caller's
      # module, and run from the caller's root, so -dir's default is its.
      - name: Check the caller pins this commit of divbast/ci
        if: github.repository != 'divbast/ci'
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          go -C .ci build -o "${GITHUB_WORKSPACE}/.ci/bin/" ./cmd/...
          .ci/bin/divbast-pin -expect "${WORKFLOW_SHA}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: /tmp

      - name: Allow unprivileged user namespaces
        if: matrix.engine == 'podman'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Rootless podman schedules an image HEALTHCHECK through a transient
      # systemd user timer. A runner has no user session, so podman silently
      # falls back to the cgroupfs manager, never runs the check, and leaves
      # State.Health a nil pointer - which reads as a broken image rather than
      # a runner that cannot schedule anything.
      - name: Give podman a systemd user session
        if: matrix.engine == 'podman'
        run: |
          sudo loginctl enable-linger "${USER}"
          uid=$(id -u)
          for _ in $(seq 30); do
            [ -S "/run/user/${uid}/bus" ] && break
            sleep 1
          done
          [ -S "/run/user/${uid}/bus" ] || {
            echo "no user bus at /run/user/${uid}/bus after 30s" >&2
            exit 1
          }
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "${GITHUB_ENV}"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" \
            >> "${GITHUB_ENV}"

      - name: Use slirp4netns rather than pasta
        if: matrix.engine == 'podman'
        run: |
          mkdir -p ~/.config/containers
          printf '[network]\ndefault_rootless_network_cmd = "slirp4netns"\n' \
            > ~/.config/containers/containers.conf
          podman info --format '{{.Host.RootlessNetworkCmd}}'
          # systemd here, not cgroupfs, or the healthcheck timer never fires.
          podman info --format '{{.Host.CgroupManager}}'

      # docker load keeps the OCI archive as it is, its zstd layers, index
      # and attestations, only in Docker's containerd image store: the
      # default for a fresh install of Docker 29, as the runner's is.
      - name: Check Docker keeps its images in the containerd store
        if: matrix.engine == 'docker'
        run: |
          status=$(docker info -f '{{json .DriverStatus}}')
          if [[ "${status}" != *'["driver-type","io.containerd.snapshotter.v1"]'* ]]; then
            echo "Docker is not on its containerd image store (driver status ${status}), which docker load below needs" >&2
            exit 1
          fi

      # Docker loads the archive itself, under the name the build's -t gave
      # it, which is IMAGE: skopeo's docker-daemon: transport refuses a zstd
      # layer, and every layer of a Docker Hardened Image is one. Podman
      # takes it through skopeo, into containers-storage.
      - name: Load the image under test
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          image=$(just --evaluate IMAGE)
          case "${ENGINE}" in
            docker) docker load -i /tmp/image.tar ;;
            podman)
              skopeo --version
              skopeo copy "oci-archive:/tmp/image.tar" "containers-storage:${image}"
              ;;
            *) echo "unknown engine ${ENGINE}" >&2; exit 1 ;;
          esac
          "${ENGINE}" image inspect "${image}" >/dev/null
          "${ENGINE}" --version

      - name: Acceptance suite
        env:
          ENGINE: ${{ matrix.engine }}
        run: just acceptance

  scan:
    name: scan
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # ask GitHub whether a published image the registry refuses is absent or private
      security-events: write # upload the findings to code scanning, from main only
    # mise exec, which is a recipe's shell, installs every tool missing from
    # the caller's mise.toml. Off, so nothing installs what the mise step
    # below leaves out.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A step's `uses: ./` and a recipe's .ci/ both resolve against the
      # caller's checkout, so this workflow's own commit goes in there.
      - name: Check out divbast/ci at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false

      # Before the pin check, which needs the caller's pinned Go, and only
      # what the scan runs: Go for the pin check and ci's tools, just for
      # the recipe, Trivy, grype for an image that says ID=dhi, and cosign,
      # which verifies Docker's VEX document for the Containerfile's final
      # stage's base, when it is a dhi.io image. An install runs code from
      # outside the repository, and this job can dismiss code scanning
      # alerts.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: core:go aqua:casey/just aqua:aquasecurity/trivy aqua:anchore/grype aqua:sigstore/cosign

      # mise installs a name that mise.toml does not declare, or declares
      # under another name, at its latest version, and succeeds. So that a
      # scan never runs a Trivy, a grype or a cosign the caller did not pin,
      # each must be the caller's, at the one version it names.
      - name: Check the caller's mise.toml pins each tool installed above
        run: |
          current=$(mise ls --current --json)
          for tool in go aqua:casey/just aqua:aquasecurity/trivy aqua:anchore/grype aqua:sigstore/cosign; do
            if ! jq -e --arg tool "${tool}" \
              '.[$tool] // [] | any(.installed and .version == .requested_version)' \
              <<<"${current}" >/dev/null; then
              echo "mise.toml must pin ${tool} to one version, under exactly that name" >&2
              exit 1
            fi
          done

      # `just setup` would otherwise check .ci out again at whatever commit
      # the caller's workflows pin, and lint with that one. ci's tools build
      # as ci's own module, since Go maps no ./.ci/ path into a caller's
      # module, and run from the caller's root, so -dir's default is its.
      - name: Check the caller pins this commit of divbast/ci
        if: github.repository != 'divbast/ci'
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          go -C .ci build -o "${GITHUB_WORKSPACE}/.ci/bin/" ./cmd/...
          .ci/bin/divbast-pin -expect "${WORKFLOW_SHA}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: /tmp

      # Fails only on what the published image does not already have. Every
      # finding, blocking or not, lands on the run's summary page. When the
      # registry refuses to show the published image, divbast-scan asks
      # GitHub, through gh and this job's token, whether it is absent,
      # private, or public and failing. Only gh gets the token: trivy,
      # grype, skopeo and cosign run without it, and DHI's VEX document is
      # fetched anonymously.
      - name: Vulnerability scan
        env:
          ARCHIVE: /tmp/image.tar
          GH_TOKEN: ${{ github.token }}
        run: just scan

      # Main's findings as code scanning alerts, which close by themselves once
      # a later scan stops finding them. Even when the scan failed, so a finding
      # that reached main is on record. Never from a pull request: GitHub would
      # then add its own check comparing the PR with main, a second gate
      # measured against something other than what is published. The scan job
      # does validate the SARIF on every pull request, and fails on a file code
      # scanning would refuse, so main's upload does not fail where a PR passed.
      - name: Upload the findings to code scanning
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: /tmp/image.tar.sarif
          # Whichever scanner wrote it: an image's alerts stay under one
          # category when its base moves to Docker's own model
          category: scan-${{ matrix.arch }}
