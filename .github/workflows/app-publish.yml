# The publish job every divbast app repository's build workflow calls from
# its daily slot and its manual run on main, once app-check.yml and the
# caller's required job have passed. It decides whether to publish, and
# never moves :latest backwards. When it publishes, it pushes the two images
# app-check built and tested, and merges them into one index under a
# staging tag. It attests that index and verifies the attestation as a user
# would, and only then tags it with the app's version and latest, so that
# neither ever names an index whose attestation has not verified. Last, it
# checks that both tags are that index to an anonymous client, as users
# pull it, or, in a rehearsal, to the job's login.
#
# The attestation is signed by this workflow, for the caller's repository
# and ref, so it verifies with
#
#   gh attestation verify oci://<image>:latest --repo <caller> \
#     --signer-workflow divbast/ci/.github/workflows/app-publish.yml \
#     --source-ref refs/heads/main
#
# With rehearse set, it decides against the image as any publish does, then
# publishes into a registry it starts inside the job instead, attesting for
# real, so that divbast/oci-image-template, which has no package, runs all
# of it while nothing reaches ghcr.io.
#
# The caller's job grants contents: read, packages: write, id-token: write
# and attestations: write, and runs only on schedule or workflow_dispatch
# from main. This workflow fails on any other event or ref, so a merge never
# publishes. Of the caller's mise.toml it installs only Go, declared there
# as "core:go" (mise reads the short "go" the same way).
name: app-publish

on:
  workflow_call:
    inputs:
      image:
        description: The image to publish, without a tag, such as ghcr.io/divbast/librespeed
        type: string
        required: true
      version-arg:
        description: The Containerfile ARG whose value is the app's version, which tags the image
        type: string
        required: true
      description:
        description: The index's description annotation, which GHCR shows on the package page
        type: string
        required: true
      rehearse:
        description: Decide against image as ever, then publish into a registry started inside the job rather than to image. For divbast/oci-image-template, which has no package; an app made from it sets image and removes this
        type: boolean
        required: false
        default: false

permissions: {}

env:
  # The mise release jdx/mise-action installs. Renovate moves it.
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.11.7

# bash with -e and pipefail, so a command that fails fails its step, in a
# pipeline too, such as the last check's skopeo into shasum. A step that
# names no shell otherwise runs bash -e alone.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: publish
    # The slot and the button each read :latest and then replace it. One at a
    # time, or each could decide against an image the other is replacing.
    # Queued rather than the default single pending slot, so a second
    # publish waiting never cancels the first. The group is the calling
    # repository's, and the calling job needs none of its own.
    concurrency:
      group: publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image and the attestation below
      id-token: write # Sigstore signs against the runner's OIDC identity
      attestations: write # actions/attest writes the provenance
    # mise exec, which is a recipe's shell, installs every tool missing from
    # the caller's mise.toml. Off, so nothing installs what the mise step
    # below leaves out.
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      # The calling job's own condition says the same. This holds even when
      # that one is wrong: divbast-publish-decision accepts a push, for
      # repositories that publish on merge, and app repositories do not.
      - name: Refuse anything but the daily slot or a manual run on main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "${EVENT}" in
            schedule | workflow_dispatch) ;;
            *)
              echo "only the daily slot and a manual run publish, not a ${EVENT} run" >&2
              exit 1
              ;;
          esac
          if [ "${REF}" != refs/heads/main ]; then
            echo "only main publishes, not ${REF}" >&2
            exit 1
          fi

      # The template's image publishes only in a rehearsal, inside the job.
      # An app made from the template that drops rehearse but keeps that
      # image would make the template's package from its own repository, so
      # it stops here, before any login or push.
      - name: Refuse the template's image outside a rehearsal
        id: template
        env:
          IMAGE: ${{ inputs.image }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          if [ "${IMAGE}" = ghcr.io/divbast/oci-image-template ] && [ "${REHEARSE}" != true ]; then
            echo "image is ghcr.io/divbast/oci-image-template, the template's, which publishes only in a rehearsal: set image to your app's own name" >&2
            exit 1
          fi

      # A repository made from divbast/oci-image-template inherits its
      # rehearse: true, and publishes nothing until it drops it
      - name: Say that this run rehearses
        if: inputs.rehearse
        env:
          REPO: ${{ github.repository }}
        run: |
          line="rehearsal: nothing was published to ghcr.io"
          if [ "${REPO}" != divbast/oci-image-template ]; then
            line="${line}; to publish, set image to this app's own and remove rehearse from the job that calls app-publish.yml"
          fi
          echo "::warning::${line}"
          echo "${line}" >> "${GITHUB_STEP_SUMMARY}"

      # Full history, so the decision below can tell a newer commit from an
      # older one
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A step's `uses: ./` and a recipe's .ci/ both resolve against the
      # caller's checkout, so this workflow's own commit goes in there.
      - name: Check out divbast/ci at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false

      # Before the pin check, which needs the caller's pinned Go, and only
      # Go: an install runs code from outside the repository, and this job
      # can push the image and sign its attestation.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: core:go

      # `just setup` would otherwise check .ci out again at whatever commit
      # the caller's workflows pin, and lint with that one. ci's tools build
      # as ci's own module, since Go maps no ./.ci/ path into a caller's
      # module, and run from the caller's root, so -dir's default is its.
      - name: Check the caller pins this commit of divbast/ci
        if: github.repository != 'divbast/ci'
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          go -C .ci build -o "${GITHUB_WORKSPACE}/.ci/bin/" ./cmd/...
          .ci/bin/divbast-pin -expect "${WORKFLOW_SHA}"

      # For `imagetools create`
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb

      # Publish, skip or fail. The slot skips when main has not moved since
      # the published image, and :latest never moves backwards: a run that
      # built an older commit would take back whatever the newer image fixed.
      # GH_TOKEN tells a private package from an absent one.
      - name: Decide whether to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          IMAGE: ${{ inputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout points origin/main at the commit this run built,
          # not at main's tip, so a newer published commit would read as one
          # that is not on main. The repository is public; no credentials.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          published=$(.ci/bin/divbast-published-revision "${IMAGE}:latest")
          .ci/bin/divbast-publish-decision -event "${EVENT}" -built "${GITHUB_SHA}" -published "${published}"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.decide.outputs.publish == 'true' && !inputs.rehearse
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # A rehearsal publishes here instead, on the runner's loopback. The
      # registry asks for a throwaway login, which Docker is given:
      # actions/attest reads it from Docker's configuration, and pushes only
      # to a registry whose first answer to its probe is a 200 or a Basic or
      # Bearer challenge, where one that asks no login says 202. buildx and
      # actions/attest speak plain HTTP to localhost of their own accord;
      # skopeo is told to. Docker's proxy can take the connection before
      # the registry listens, and reset it, so the wait retries every error.
      - name: Start the rehearsal's registry
        if: steps.decide.outputs.publish == 'true' && inputs.rehearse
        run: |
          # The password is rehearsal, hashed with bcrypt, which is all the
          # registry reads
          cat > "${RUNNER_TEMP}/rehearsal.htpasswd" <<'EOF'
          rehearsal:$2y$05$EjEe94vjHWGY2fBH.Ugl6OucgCONUqj7tMeTnrww.QLljzQK06KEW
          EOF
          # renovate: registry
          docker run -d -p 127.0.0.1:5000:5000 -v "${RUNNER_TEMP}/rehearsal.htpasswd:/auth/htpasswd:ro" -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=rehearsal -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors -u rehearsal:rehearsal -o /dev/null http://127.0.0.1:5000/v2/
          mkdir -p "${HOME}/.config/containers/registries.conf.d"
          printf '[[registry]]\nlocation = "localhost:5000"\ninsecure = true\n' \
            > "${HOME}/.config/containers/registries.conf.d/rehearsal.conf"
          echo rehearsal | docker login --username rehearsal --password-stdin localhost:5000

      # Each artifact lands in its own directory under this path
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.decide.outputs.publish == 'true'
        with:
          pattern: image-*
          path: /tmp/images
      - name: Read the version from the Containerfile
        if: steps.decide.outputs.publish == 'true'
        id: version
        env:
          VERSION_ARG: ${{ inputs.version-arg }}
        run: |
          if [[ ! "${VERSION_ARG}" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "version-arg must name an ARG, not ${VERSION_ARG}" >&2
            exit 1
          fi
          v=$(sed -n "s/^ARG ${VERSION_ARG}=//p" Containerfile)
          if [[ ! "${v}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Containerfile has no one ARG ${VERSION_ARG}= line whose value can tag an image" >&2
            exit 1
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
      # Where every step below writes: the caller's image, or in a
      # rehearsal the same path in the registry started above
      - name: Choose where to publish
        if: steps.decide.outputs.publish == 'true'
        id: target
        env:
          IMAGE: ${{ inputs.image }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          if [ "${REHEARSE}" = true ]; then
            echo "image=localhost:5000/${IMAGE#*/}" >> "${GITHUB_OUTPUT}"
          else
            echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Push each tested architecture
        if: steps.decide.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            skopeo copy --all \
              --digestfile "/tmp/digest-${arch}" \
              --dest-authfile "${HOME}/.docker/config.json" \
              "oci-archive:/tmp/images/image-${arch}/image.tar" \
              "docker://${IMAGE}:${VERSION}-${arch}"
          done
      # Under a tag no one is meant to pull, so that no public tag moves
      # before the attestation below verifies. The next publish overwrites
      # it.
      - name: Merge the architectures into one index under a staging tag
        if: steps.decide.outputs.publish == 'true'
        id: merge
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          created=$(date -u -d "@$(git log -1 --pretty=%ct)" +%Y-%m-%dT%H:%M:%SZ)
          docker buildx imagetools create \
            --metadata-file /tmp/index.json \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.created=${created}" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            -t "${IMAGE}:${VERSION}-staging" \
            "${IMAGE}@$(cat /tmp/digest-amd64)" \
            "${IMAGE}@$(cat /tmp/digest-arm64)"
          digest=$(jq -er '."containerimage.descriptor".digest' /tmp/index.json)
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      # BuildKit's is about what went into the image. This says the image came
      # out of the caller's main branch through this workflow, signed against
      # the runner's OIDC identity
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.decide.outputs.publish == 'true'
        with:
          subject-name: ${{ steps.target.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # What a user runs before trusting the image, against the index's own
      # bytes, fetched by digest and checked against it: gh looks the
      # attestation up by the file's digest, so it needs nothing from the
      # registry, and an empty DOCKER_CONFIG keeps the login above from it.
      # Off a terminal, gh prints nothing when it succeeds, so the JSON is
      # what the log shows.
      - name: Verify the index's attestation
        if: steps.decide.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          skopeo inspect --raw "docker://${IMAGE}@${DIGEST}" > /tmp/index-manifest.json
          fetched=$(shasum -a 256 < /tmp/index-manifest.json)
          if [ "sha256:${fetched%% *}" != "${DIGEST}" ]; then
            echo "${IMAGE}@${DIGEST} came back as bytes whose digest is sha256:${fetched%% *}" >&2
            exit 1
          fi
          empty=$(mktemp -d)
          verify() {
            DOCKER_CONFIG="${empty}" gh attestation verify /tmp/index-manifest.json \
              --repo "${REPO}" \
              --signer-workflow divbast/ci/.github/workflows/app-publish.yml \
              --source-ref refs/heads/main \
              --format json > /tmp/verified.json
          }
          # Three tries, ten seconds apart, for an attestation made moments
          # ago that the API does not return yet
          verify || { sleep 10 && verify; } || { sleep 10 && verify; }
          # For the log alone: gh's exit status is the verdict
          signer=$(jq -r '(.[0].verificationResult.signature.certificate.buildSignerURI)? // "unknown"' /tmp/verified.json) ||
            signer=unknown
          echo "${IMAGE}@${DIGEST} verifies, signed by ${signer}"

      # The index is attested, and the attestation verifies: the public tags
      # move now. Given one index and no annotations, imagetools pushes the
      # index's own bytes, and its dry run prints the bytes it would push and
      # a newline, so the tags move only once those are known to be the
      # index attested. moving says the tags may have moved from then on.
      - name: Tag the attested index with the version and latest
        if: steps.decide.outputs.publish == 'true'
        id: promote
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          args=(
            -t "${IMAGE}:${VERSION}"
            -t "${IMAGE}:latest"
            "${IMAGE}@${DIGEST}"
          )
          docker buildx imagetools create --dry-run "${args[@]}" > /tmp/promoted.json
          size=$(wc -c < /tmp/promoted.json)
          would=$(head -c "$((size - 1))" /tmp/promoted.json | shasum -a 256)
          if [ "sha256:${would%% *}" != "${DIGEST}" ]; then
            echo "imagetools would tag sha256:${would%% *}, not ${DIGEST}, the index attested" >&2
            exit 1
          fi
          echo "moving=true" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools create "${args[@]}"

      # What users pull, as they pull it: anonymously. A private package, or
      # a tag that is not the index attested, fails the run here rather than
      # when someone first pulls. A rehearsal's registry is the job's own and
      # takes no anonymous pulls, so a rehearsal reads with the job's login.
      - name: Check both tags are the attested index as users pull them
        if: steps.decide.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.merge.outputs.digest }}
          ANONYMOUS: ${{ !inputs.rehearse }}
        run: |
          creds=(--no-creds)
          who="an anonymous client"
          if [ "${ANONYMOUS}" = false ]; then
            creds=()
            who="the job's login"
          fi
          for tag in "${VERSION}" latest; do
            if ! pulled=$(skopeo inspect --raw "${creds[@]}" "docker://${IMAGE}:${tag}" | shasum -a 256) ||
              [ "sha256:${pulled%% *}" != "${DIGEST}" ]; then
              echo "${IMAGE}:${tag} is not ${DIGEST} to ${who}" >&2
              exit 1
            fi
            echo "${IMAGE}:${tag} is ${DIGEST} to ${who}"
          done

      # A failure before the promotion begins to move the tags, its dry run
      # included, leaves them where they were. A re-run of the failed job
      # downloads this run's images again, which app-check keeps for a day,
      # and the decision reads :latest again, so it publishes unless a newer
      # image has taken :latest since.
      - name: Say that the public tags did not move
        if: failure() && steps.decide.outputs.publish == 'true' && steps.promote.outputs.moving != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::error::the public tags :${VERSION:-<version>} and :latest did not move." \
            "Re-running the failed job publishes for a day after this run built its images, while their artifacts last," \
            "unless a newer image has been published since; after that, the next daily slot or a manual run publishes."
