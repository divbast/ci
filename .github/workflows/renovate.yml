# Self-hosted Renovate for the calling repository and no other, which every
# divbast repository calls from its own triggers. It authenticates as the
# divbast org's `divbast-renovate` GitHub App, so its pull requests trigger
# the caller's CI the way a person's would, and it can move the action pins
# under .github/workflows, which a GITHUB_TOKEN may not write. The job reads
# the App's private key from the caller's `renovate` environment, which
# only main may deploy to, so it runs from main alone. divbast/infra
# manages that environment, its client ID and key, and the kill switch the
# caller passes as `automerge`.
#
# Docker Hardened Images answer nothing without a login, so Renovate sees
# no tag or digest of a dhi.io image unless it has credentials. A caller
# that passes the input dhi-username and the secret DHI_TOKEN gives Renovate
# a docker host rule for dhi.io; both are optional, and a caller that passes
# neither runs Renovate with no host rule, as before. DHI_TOKEN is a repo
# secret, and a repo secret reaches this job although it runs in an
# environment.
#
# Renovate merges its own pull requests, through the API with a squash, once
# every check on one has passed, and only while `automerge` is true. A
# squash, because main requires signed commits and GitHub signs the commit a
# squash makes; it cannot sign a rebase. GitHub's own auto-merge stays off,
# so the kill switch is the one switch. One merge per run: the merge leaves
# the other pull requests behind main, and they rebase and re-test first.
name: renovate

on:
  workflow_call:
    inputs:
      automerge:
        description: The kill switch, true only while the caller's automerge variable is `enabled`
        type: boolean
        required: true
      dhi-username:
        description: >-
          The Docker Hardened Images (dhi.io) username that DHI_TOKEN
          belongs to. When set, Renovate gets a host rule for dhi.io
        type: string
        default: ''
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        description: The divbast-renovate App's private key, the caller's `renovate` environment secret
        required: true
      DHI_TOKEN:
        description: The access token for dhi-username on dhi.io, a repo secret
        required: false

permissions: {}

jobs:
  renovate:
    name: renovate
    # Renovate rewrites the dashboard on every run, and an App's edits fire
    # events where a GITHUB_TOKEN's would not. Without the sender check every
    # run would schedule the next. github.event is the caller's event.
    if: >-
      github.event_name != 'issues'
      || (github.event.issue.title == 'Dependency Dashboard'
          && github.event.sender.type == 'User')
    # On the job rather than the workflow. GitHub keeps one pending run per
    # group and a newer one replaces it, so a run the `if` above skips (the
    # App's own dashboard edit, every run) would otherwise take that slot and
    # cancel a useful run waiting in it. A skipped job never joins the group:
    # on 2026-10-29 the run a dashboard edit started was skipped while a
    # workflow_run run waited here, and that run went ahead uncancelled.
    concurrency:
      group: renovate
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # For the App's key, not a deployment. The environment's branch policy
    # still holds without one, and a daily run would otherwise bury the
    # deployment history. A called job that names an environment reads the
    # caller's: its variables are the calling repository's. Its secrets are
    # not handed over on their own: the caller must pass the key by name, or
    # it arrives as an empty string.
    environment:
      name: renovate
      deployment: false
    # Everything goes through the App token below; the job's own needs nothing.
    permissions: {}
    steps:
      # Narrowed to the calling repository and to the permissions Renovate
      # uses, each named below.
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      # No checkout. Renovate clones the repository through the token and reads
      # renovate.json from the default branch.
      - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ steps.token.outputs.token }}
          # The action's own default is the floating major tag. Renovate's
          # github-actions manager reads a tag and digest from this input and
          # moves both, so the bot updates itself through a pull request like
          # everything else. renovate-version would not do: the manager takes
          # all of its value, digest included, as the version. With a tag in
          # the image, the action ignores that input.
          renovate-image: ghcr.io/renovatebot/renovate:44.261.3@sha256:a94fbfa1977a07f98a6291b20ad630d076325526a64e730ebc1c61e4f648cff5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # Commits go through the API, which GitHub signs as the App.
          RENOVATE_PLATFORM_COMMIT: enabled
          # The kill switch, failing closed: Renovate merges only while
          # `automerge` is true. False forces automerge off, over
          # renovate.json and every packageRule. It acts from the next run
          # and cannot recall a merge already made.
          RENOVATE_FORCE: ${{ case(inputs.automerge, '', '{"automerge":false}') }}
          # dhi.io answers nothing without a login. Renovate parses this as
          # JSON, so without credentials it is [], no rules, where an empty
          # string would fail the parse. toJSON quotes the username and the
          # token, so a quote or a backslash in either stays inside its string.
          RENOVATE_HOST_RULES: ${{ inputs.dhi-username != '' && format('[{{"matchHost":"dhi.io","hostType":"docker","username":{0},"password":{1}}}]', toJSON(inputs.dhi-username), toJSON(secrets.DHI_TOKEN)) || '[]' }}
          # The only commands a repository's postUpgradeTasks may run. They
          # regenerate committed code in the pull request that bumps what it
          # is generated from, so the files stay in step with the bump. Each
          # pattern is one exact command, anchored at both ends, and nothing
          # sets the list but this line: the tasks run in this job, beside
          # the App token, so a repository's renovate.json can neither widen
          # the list nor chain a second command onto one, as Renovate runs
          # each without a shell. In order:
          # - templ generate writes the Go for each .templ file, run as the
          #   templ that tools/go.mod pins;
          # - sqlc generate writes the query code, run as the sqlc that
          #   tools/go.mod pins;
          # - pnpm install puts the locked packages in node_modules, which
          #   Renovate's own lockfile update never creates, for genicons to
          #   read; --frozen-lockfile installs only what the lockfile holds,
          #   --ignore-scripts runs no package's install script, and
          #   --ignore-pnpmfile runs no pnpmfile hook of the repository's;
          # - go run ./cmd/genicons writes the icons from lucide-static.
          # The patterns bound the command line only: a repository's .npmrc
          # or pnpm-workspace.yaml can still change what pnpm does, as the
          # repository's own code runs here anyway.
          # Renovate parses the value as JSON5, which reads an unknown escape
          # such as a backslash before a dot as the dot alone, matching any
          # character. So each backslash is doubled, to reach the pattern as
          # one.
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^go tool -modfile=tools/go\\.mod templ generate$",
            "^go tool -modfile=tools/go\\.mod sqlc generate$",
            "^pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile$",
            "^go run \\./cmd/genicons$"]
